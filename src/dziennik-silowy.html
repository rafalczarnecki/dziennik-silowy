  const WU={hinge:'hinge',dead:'hinge',squat:'goblet',uni:'wykrok',vpull:'zwis'}, ST={hinge:'dwuglowe',ham:'dwuglowe',squat:'czworoglowe',uni:'czworoglowe',squatM:'czworoglowe',bench:'klatka',vpull:'najszerszy',hpull:'najszerszy'};
  W.forEach((d,i)=>{const ps=[...new Set(d.items.map(it=>patOf(it.n)))].filter(x=>!srcPat[i].has(x));
    ps.forEach(p=>{if(WU[p]&&!d.warmup.some(r=>r[0]===WU[p]))d.warmup.push([WU[p],60]);if(ST[p]&&!d.stretch.some(r=>r[0]===ST[p]))d.stretch.splice(Math.max(0,d.stretch.length-1),0,[ST[p],60])})});
  // 10. plan w formacie aplikacji
  const nm=genName(P,phase);
  const days=W.map((d,i)=>({name:P.days[i].name,ex:d.items.filter(it=>!it.x).map(it=>{const a=[it.n,it.sets,it.reps,it.sch||'',it.rir??''];if(it.ss)a.push(null,it.ss);return a}),warmup:d.warmup,stretch:d.stretch}));
  const mainN=new Set(days.flatMap(d=>d.ex.map(x=>x[0])));
  const extra={};Object.keys(GOALS).forEach(k=>{
    if(k===goal&&S.syl!==false){extra[k]=W.map(d=>d.items.filter(it=>it.x).map(it=>[it.n,it.sets,it.reps,it.lo??null,it.ss||null,it.rest||null,it.lab||null]));return}
    // inne cele: dodatki z bieżącego planu bez dubli i konfliktów z nowym dniem; superserie bez wspólnej okolicy
    extra[k]=days.map((d,i)=>{const e=(((src.extra||{})[k]||[])[i]||[]).filter(x=>!mainN.has(x[0])&&!clashes([...d.ex.map(y=>y[0]),x[0]]).length).map(x=>x.slice());
      const gs={};e.forEach(x=>{if(x[4])(gs[x[4]]=gs[x[4]]||[]).push(x)});Object.values(gs).forEach(q=>{if(q.length!==2||regOf(q[0][0]).some(r=>regOf(q[1][0]).includes(r)))q.forEach(x=>x[4]=null)});return e})});

  if(phase==='real')plan.test={weeks:[4]};

  // rampa: kroki 2,5–5 kg (wskazówka przy ćwiczeniu, jeśli nie masz własnej)
  days.forEach(d=>d.ex.forEach(x=>{if(x[3]==='rampa'&&!cueOf(x[0])&&!(plan.cues||{})[x[0]])(plan.cues=plan.cues||{})[x[0]]='Rampa: każda seria trochę cięższa, kroki 2,5–5 kg. Najciężej w ostatniej serii.'}));
  plan.gen={at:new Date().toISOString(),from:cur,phase,cal:cal.known?cal.wd:null,why,macro:{id:mp.m?mp.m.id:null,idx}};
  const ev=evalPlan(plan,{cur,cal,pref,hist});

  plan.gen.prio=Object.fromEntries(prio.map(m=>[m,Math.round((ev.vol[m]||0)*2)/2]));
  return {plan,ev,macro:{id:mp.m?mp.m.id:null,idx,goals:idx===0?macroGoals(plan):JSON.parse(JSON.stringify(mp.m.goals||{}))}};
}

// ocena planu: 100 punktów minus błędy (15), ostrzeżenia (5) i uwagi (1)
function evalPlan(p,c={}){
  const goal=GOALS[S.goal]?S.goal:'sport', g=GOALS[goal], prio=g.prio, cur=c.cur||S.plan, ex=(p.extra||{})[goal]||[];
  const D=p.days.map((d,i)=>[...d.ex.map(x=>({n:x[0],sets:x[1],reps:x[2],sch:x[3]||'',ss:x[6]||null,x:false})),...(d.add||[]).map(x=>({n:x[0],sets:x[1],reps:x[2],x:false})),
    ...(S.syl!==false?(ex[i]||[]):[]).map(x=>({n:x[0],sets:x[1],reps:x[2],lo:x[3],ss:x[4]||null,x:true}))]);
  const all=D.flat(), I=[], add=(lv,t)=>I.push({lv,t});
  const cal=c.cal||calendar(cur,p.days.length), pref=c.pref||genPrefs(), hist=c.hist||(n=>exHist(n,cur));
  const dn=i=>(p.dayPrefix||'')+p.days[i].name+(cal.known?` (${WD[cal.wd[i]]})`:'');
  const guide=Object.assign({},G,p.guide||{});
  all.forEach(it=>{if(!guide[it.n])add('err',`${it.n}: ćwiczenie spoza bazy aplikacji (brak opisu i partii).`)});
  D.forEach((d,i)=>clashes(d.map(it=>it.n)).forEach(x=>add('err',`${dn(i)}: dwa ćwiczenia na ${MG[x.m].toLowerCase()} (${x.names.join(' + ')}).`)));
  D.forEach((d,i)=>{const gs={};d.forEach(it=>{if(it.ss)(gs[it.ss]=gs[it.ss]||[]).push(it)});
    Object.values(gs).forEach(q=>{if(q.length!==2)return;const [a,b]=q;
      if(regOf(a.n).some(r=>regOf(b.n).includes(r)))add('err',`${dn(i)}: superseria ${a.n} + ${b.n} męczy tę samą okolicę.`);
      else if(q.some(x=>!['iso','core','cond'].includes(gRole(x))))add('warn',`${dn(i)}: ćwiczenie złożone w superserii (${a.n} + ${b.n}).`)})});
  all.forEach(it=>{if(pref.out[it.n])add('err',`${it.n}: wraca, choć ${pref.out[it.n]}.`)});
  const back=D.map(d=>d.filter(it=>['dead','hinge'].includes(patOf(it.n))));
  for(let i=0;i<D.length;i++)for(let j=i+1;j<D.length;j++){if(!back[i].length||!back[j].length)continue;const gp=calGap(cal.wd,i,j),L=[...back[i],...back[j]].map(x=>x.n).join(' + ');
    if(gp<2)add('err',`${dn(i)} i ${dn(j)}: ${L} dzień po dniu, dolne plecy bez odpoczynku.`);
    else if(gp===2&&[...back[i],...back[j]].some(it=>patOf(it.n)==='dead'))add('warn',`${dn(i)} i ${dn(j)}: ${L} co 2 dni, za mało odpoczynku dla dolnych pleców.`)}
  const hs=all.filter(it=>patOf(it.n)==='hinge').length, cs=all.filter(it=>patOf(it.n)==='ham').length;
  if(cs>=2&&!hs)add('warn',`Tył uda: ${cs} uginania nóg i żadnego skłonu: ten sam ruch dwa razy.`);
  if(hs>=2)add('warn','Tył uda: dwa skłony w tygodniu obok martwego ciągu, za dużo pracy dolnych pleców.');
  D.forEach((d,i)=>{const f=d.filter(it=>isFD(it.n));if(f.length>1)add('warn',`${dn(i)}: dwa ciężkie wyciskania na przednie barki (${f.map(x=>x.n).join(' + ')}).`)});
  const m=tModel(), est=D.map(d=>tGroups(genGroups(d),m));
  est.forEach((t,i)=>{if(t>7200)add('err',`${dn(i)}: szacunkowo ${fdur(t)}, ponad 2 h.`);else if(t>TCAP)add('warn',`${dn(i)}: szacunkowo ${fdur(t)}, blisko 2 h.`)});
  const v={};all.forEach(it=>Object.entries(musOf(it.n)).forEach(([mm,w])=>v[mm]=(v[mm]||0)+it.sets*w));
  prio.forEach(mm=>{const x=v[mm]||0;if(x<g.vol[0])add('err',`${MG[mm]}: ${fmt(x)} serii w tygodniu, poniżej celu ${g.vol[0]}–${g.vol[1]}.`);else if(x<g.vol[0]+2)add('warn',`${MG[mm]}: ${fmt(x)} serii, dolna granica celu.`);else if(x>g.vol[1])add('warn',`${MG[mm]}: ${fmt(x)} serii, ponad cel ${g.vol[1]}.`)});
  Object.keys(MG).filter(mm=>!prio.includes(mm)).forEach(mm=>{const x=v[mm]||0;if(x>12)add('warn',`${MG[mm]}: ${fmt(x)} serii, dużo jak na partię bez priorytetu.`);else if(x>10)add('info',`${MG[mm]}: ${fmt(x)} serii, głównie praca pośrednia z innych ćwiczeń.`)});
  ['czw','dwu','klatka','poziom','pion'].forEach(mm=>{if(!prio.includes(mm)&&(v[mm]||0)<4)add('warn',`${MG[mm]}: tylko ${fmt(v[mm]||0)} serii w tygodniu.`)});
  prio.forEach(mm=>{const k=D.filter(d=>d.some(it=>musOf(it.n)[mm]===1)).length;if(k<2)add('warn',`${MG[mm]} (priorytet): tylko ${k} dzień w tygodniu.`)});
  const sum=ps=>all.filter(it=>ps.includes(patOf(it.n))).reduce((a,it)=>a+it.sets,0), push=sum(['bench','close','ohp']), pull=sum(['vpull','hpull']);
  if(goal!=='sila'&&pull<push)add('warn',`Ciągnięcie ${pull} serii, wyciskanie ${push}: dla sylwetki ciągnięcia powinno być co najmniej tyle samo.`);
  if(!(p.light&&(p.light.weeks||[]).length))add('warn','Brak lżejszego tygodnia.');
  D.forEach((d,i)=>{const r=d.filter(it=>!it.x);r.forEach((it,k)=>{if(gRole(it)==='main'&&r.slice(0,k).some(o=>RANK[gRole(o)]>=2))add('warn',`${dn(i)}: ${it.n} po izolacji albo brzuchu, a bój powinien być na początku.`)})});
  all.forEach(it=>{if(gRole(it)==='cond')return;const h=hist(it.n);if(h.stalled&&h.last&&it.reps===h.last.reps)add('warn',`${it.n}: bez postępu w 3 ostatnich treningach, a zakres powtórzeń zostaje ten sam.`)});
  all.forEach(it=>{const h=hist(it.n);if(Number.isInteger(it.reps)&&h.last&&!h.last.kg&&it.reps>h.last.minR+3)add('warn',`${it.n}: plan ${it.reps} powtórzeń, ostatnio ${h.last.minR} w serii.`)});
  if(goal==='sport'){const a=all.filter(it=>['curl','ext'].includes(patOf(it.n))).reduce((s,it)=>s+it.sets,0);if(a>6)add('info',`Izolacja ramion ${a} serii: cel sylwetki sportowej zakłada mniej.`)}
  all.forEach(it=>{if(it.sch!=='rampa')return;const h=hist(it.n),st=(h.last&&h.last.steps)||[];if(st.some(s=>s>5))add('info',`${it.n}: ostatnio kroki rampy do ${fmt(Math.max(...st))} kg; aplikacja podpowie kroki 2,5–5 kg.`)});
  if(PLANS[cur]&&cur!==p.id){const prevX=PLANS[cur].days.flatMap((_,i)=>dayEx(cur,i).map(x=>x.ex)),prev=new Set(prevX.map(x=>x[0])),now=new Set(all.map(it=>it.n)),k=[...now].filter(x=>prev.has(x)).length/Math.max(1,now.size);
    const repsNew=all.some(it=>MAIN_N.includes(it.n)&&prevX.some(x=>x[0]===it.n&&x[2]!==it.reps));
    if(k<0.4)add('info',`Zostaje ${Math.round(k*100)}% ćwiczeń z poprzedniego bloku: trudniej porównać wyniki.`);else if(k>0.9&&!repsNew)add('info',`${Math.round(k*100)}% ćwiczeń i zakresy bojów bez zmian: mało nowego bodźca.`)}
  const score=Math.max(0,100-I.reduce((a,x)=>a+(x.lv==='err'?15:x.lv==='warn'?5:1),0));
  return {score,issues:I,vol:v,est};
}

  const [lo,hi]=g.vol, rows=Object.keys(MG).filter(m=>ev.vol[m]).map(m=>{const x=Math.round(ev.vol[m]*2)/2,pr=g.prio.includes(m),st=x>hi?'dużo':pr&&x<lo?'mało':x<LOV(m)?'mało':'';
    return `<p class="genv"><span>${pr?'★ ':''}${MG[m]}${st?` <em class="hi">${st}</em>`:''}</span><b>${fmt(x)}</b><span class="meta">${pr?lo+'–'+hi:LOV(m)+'–10'}</span></p>`}).join('');
  h+=`<div class="card"><h3>Bilans tygodnia</h3><p class="meta">Serie na partię w tygodniu (pośrednie liczone jako pół) i zakres celu ${esc(g.name)}. ★ = priorytet celu.</p>${rows}</div>`;
  const LV={err:'Błąd',warn:'Uwaga',info:'Informacja'};
  h+=`<div class="card"><h3>Kontrola planu</h3>${ev.issues.length?ev.issues.map(x=>`<p><b>${LV[x.lv]}:</b> ${esc(x.t)}</p>`).join(''):'<p>Bez uwag: jedna partia na dzień, martwy ciąg i skłony z odpoczynkiem, superserie bez wspólnej partii, bilans serii w celu, czas do ok. 1 h 50 min.</p>'}
    <p class="meta">Czas liczony z twoich zapisów (przerwy, przejścia, rozgrzewka i rozciąganie), z poprawką o różnicę z ostatnich treningów.</p></div>`;
  h+=`<button class="primary" data-genok="1">Zapisz i zacznij od tygodnia 1</button>
    <p class="row" style="margin-top:10px"><button class="ghost" data-gensave="1">Zapisz na później</button><button class="ghost" data-gendrop="1">Odrzuć</button></p>
    <p class="meta">Zapisany plan trafia do kopii zapasowej i do eksportu dla Claude razem z powodami zmian, więc przy przeglądzie co 2–3 miesiące widać, co i dlaczego ułożyła aplikacja.</p>`;
  return h;
}

// wczytanie z linku: #pakiet=… (dane w części po #, nie trafiają na serwer)
function hashImport(){
  const m=location.hash.match(/^#(?:pakiet|plan|kopia)=(.+)$/); if(!m)return;
  history.replaceState(null,'',location.pathname+location.search);
  let txt;try{const b=atob(m[1].replace(/-/g,'+').replace(/_/g,'/'));txt=new TextDecoder().decode(Uint8Array.from(b,c=>c.charCodeAt(0)))}catch(e){return toast('Link jest uszkodzony. Poproś o nowy.')}
  importAny(txt);
}
setTimeout(hashImport,0);
setTimeout(()=>{try{if(ghCfg().dirty)ghSync()}catch(e){}try{ghPlans()}catch(e){}},2500);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')try{ghPlans()}catch(e){}});
installAll();
migrate();
render();
</script>
