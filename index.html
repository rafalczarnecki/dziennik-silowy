let tt;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)}

// ---------- timer ----------
let tEnd=0,tInt=null;
function startTimer(sec){tEnd=Date.now()+sec*1000;$('#timer').classList.add('on');$('#timer').classList.remove('end');clearInterval(tInt);tInt=setInterval(tick,250);tick()}
function tick(){
  const left=Math.round((tEnd-Date.now())/1000), el=$('#tval'), a=Math.abs(left);
  el.innerHTML=(left<0?'+':'')+Math.floor(a/60)+':'+String(a%60).padStart(2,'0')+'<small>'+(left<0?'czas na serię':'przerwa')+'</small>';
  if(left<=0&&!$('#timer').classList.contains('end')){$('#timer').classList.add('end');try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}
}
function stopTimer(){clearInterval(tInt);$('#timer').classList.remove('on','end')}
$('#tminus').onclick=()=>{tEnd-=30000;$('#timer').classList.remove('end');tick()};
$('#tplus').onclick=()=>{tEnd+=30000;$('#timer').classList.remove('end');tick()};
setInterval(()=>{const el=document.getElementById('elapsed'),st=S.starts[dkey()];if(el&&st)el.textContent=fdur((Date.now()-st)/1000)},15000);
$('#tstop').onclick=stopTimer;

$('#view').addEventListener('click',async e=>{

    {const sw=S.swaps[pkey()];if(sw)Object.keys(sw).forEach(i=>{if(sw[i].once)delete sw[i]})}

  if(t.dataset.animpause||t.dataset.animrestart)return animCtl(t);
  if(t.dataset.animvar){const [n,k]=t.dataset.animvar.split('|');S.animv=Object.assign(S.animv||{},{[n]:k});save();return render()}
  if(t.dataset.info){const k=t.dataset.info;infoOpen.has(k)?infoOpen.delete(k):infoOpen.add(k);return render()}
  if(t.dataset.startnow){markStart();return toast('Zegar treningu włączony')}
  if(t.dataset.swapopen){swapOpen=+t.dataset.swapopen;return render()}
  if(t.dataset.swapx){swapOpen=null;return render()}
  if(t.dataset.swap){
    const [i,n,once]=t.dataset.swap.split('|'), pk=pkey();
    (S.swaps[pk]=S.swaps[pk]||{})[i]=once?{name:n,since:Date.now(),once:true,dk:dkey()}:{name:n,since:Date.now()};
    swapOpen=null; save(); render(); return toast(once?'Tylko na dziś: '+n:'Zamieniono na stałe: '+n);
  }
  if(t.dataset.vswap){
    const [i,n,base]=t.dataset.vswap.split('|'), pk=pkey();
    (S.swaps[pk]=S.swaps[pk]||{})[i]={name:n,since:Date.now(),v:base};
    save(); render(); ghMark(); return toast('Wariant na '+VWEEKS+' tygodnie: '+n);
  }
  if(t.dataset.unswap){
    const pk=pkey(), i=t.dataset.unswap, sw=S.swaps[pk]&&S.swaps[pk][i];
    // po powrocie z wariantu zastój liczony od nowa
    if(sw&&sw.v){const b=sw.v;S.weak[b]={from:metricHist(b).length}}
    if(S.swaps[pk])delete S.swaps[pk][i];
    save(); render(); return toast('Wrócono do ćwiczenia z planu');
  }
  if(t.dataset.sylrm){const pk=pkey();S.sylOff[pk]=[...(S.sylOff[pk]||[]),t.dataset.sylrm];S.longOk[pk]=t.dataset.ref;save();render();return toast('Usunięto z tego dnia. Przywrócisz w Ustawieniach.')}
  if(t.dataset.short){const pk=pkey();S.shortRest[pk]=true;S.longOk[pk]=t.dataset.ref;save();render();return toast('Przerwy na pomocniczych: 90 s')}
  if(t.dataset.longok){S.longOk[pkey()]=t.dataset.longok;save();return render()}
  if(t.dataset.restore){const [k,v]=t.dataset.restore.split('|');if(v==='__short')delete S.shortRest[k];else S.sylOff[k]=(S.sylOff[k]||[]).filter(x=>x!==v);save();render();return toast('Przywrócono')}
  if(t.dataset.syl){S.syl=!(S.syl!==false);save();render();return toast(S.syl?'Sekcja Sylwetka włączona':'Sekcja Sylwetka wyłączona')}
  if(t.dataset.stick){
    const [name,pt]=t.dataset.stick.split('|'), st=stallInfo(name); if(!st)return;
    const fr=(S.weak[name]||{}).from; S.weak[name]=Object.assign(pt==='reset'?{n:st.n}:{n:st.n,pt},fr?{from:fr}:{}); save(); return render();
  }
  if(t.dataset.dismiss){const st=stallInfo(t.dataset.dismiss);S.weak[t.dataset.dismiss]=Object.assign(S.weak[t.dataset.dismiss]||{},{dismissed:st?st.n:0});save();return render()}
  if(t.dataset.addx){
    const k=pkey(); S.extras[k]=(S.extras[k]||[]).filter(x=>x.for!==t.dataset.for);
    S.extras[k].push({name:t.dataset.addx,for:t.dataset.for}); save(); render(); return toast('Dodano na koniec treningu');
  }
  if(t.dataset.rmx){
    const k=pkey(); S.extras[k]=(S.extras[k]||[]).filter(x=>x.name!==t.dataset.rmx);
    delete draft()['x:'+t.dataset.rmx]; save(); render(); return toast('Usunięto z treningu');
  }
  if(t.dataset.del!=null){ if(!twoTap('del'+t.dataset.del,t,'Na pewno? Dotknij ponownie'))return; armed=null; S.sessions.splice(+t.dataset.del,1); save(); render(); ghMark(); return toast('Trening usunięty') }
  if(t.id==='showexp'){const a=$('#exptxt');a.hidden=false;a.value=JSON.stringify((()=>{const o={app:'dziennik-silowy',v:2};KEEP.forEach(k=>o[k]=S[k]);return o})());a.focus();a.select();
    let ok=false;try{ok=document.execCommand('copy')}catch(e){}
    if(!ok&&navigator.clipboard){try{await navigator.clipboard.writeText(a.value);ok=true}catch(e){}}
    return toast(ok?'Skopiowano. Wklej w nowej wersji w „Wczytaj kopię”.':'Zaznacz i skopiuj tekst poniżej')}
  if(t.id==='exp'){
    const o={app:'dziennik-silowy',v:2};KEEP.forEach(k=>o[k]=S[k]);
    return saveFile('dziennik-silowy-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(o),'application/json');
  }
  if(t.id==='expclaude'){
    return saveFile('dziennik-dla-claude-'+new Date().toISOString().slice(0,10)+'.md',mdExport(),'text/markdown');
  }
  if(t.id==='impbtn'){
    let o; try{o=JSON.parse($('#imp').value.trim())}catch(err){return toast('To nie jest poprawny tekst kopii')}
    if(o&&(o.type==='dziennik-plan'||o.type==='dziennik-pakiet'))return loadPlan($('#imp').value);
    if(!o||!Array.isArray(o.sessions))return toast('W tekście brakuje listy treningów');
    if(!twoTap('imp',t,'Połączyć z historią? Dotknij ponownie'))return; armed=null;
    return importData(o);
  }
});
// rozpoznaje rodzaj pliku: plan/pakiet → loadPlan, kopia → importData
function importAny(txt,confirmed){
  let o;try{o=JSON.parse(String(txt).trim())}catch(e){return toast('To nie jest plik z aplikacji (zły format)')}
  if(o&&(o.type==='dziennik-plan'||o.type==='dziennik-pakiet'))return loadPlan(txt);
  if(o&&Array.isArray(o.sessions))return importData(o);
  toast('Nie rozpoznano pliku. Wczytaj kopię zapasową albo plik planu z aplikacji.');
}
function importData(o){
    const wasEmpty=!S.sessions.length;
    const have=new Set(S.sessions.map(x=>x.date)); let added=0;
    o.sessions.forEach(x=>{if(x&&x.date&&!have.has(x.date)){S.sessions.push(x);added++}});
    S.sessions.sort((a,b)=>Date.parse(a.date)-Date.parse(b.date));
    if(Array.isArray(o.bw)){const hb=new Set(S.bw.map(x=>x.d));o.bw.forEach(x=>{if(!hb.has(x.d))S.bw.push(x)});S.bw.sort((a,b)=>Date.parse(a.d)-Date.parse(b.d))}
    ['weak','extras','swaps','sylOff','shortRest','cycles','userPlans','cues'].forEach(k=>{if(o[k]&&typeof o[k]==='object'){S[k]=S[k]||{};Object.keys(o[k]).forEach(x=>{if(S[k][x]===undefined)S[k][x]=o[k][x]})}});
    ['cardio','waist'].forEach(k=>{if(Array.isArray(o[k])){S[k]=S[k]||[];const h=new Set(S[k].map(x=>x.d));o[k].forEach(x=>{if(x&&x.d&&!h.has(x.d))S[k].push(x)});S[k].sort((a,b)=>Date.parse(a.d)-Date.parse(b.d))}});
    if(o.goal&&GOALS[o.goal])S.goal=o.goal;
    if(o.profile&&!S.profile)S.profile=o.profile;
    if(wasEmpty&&o.plan){if(PLANS[o.plan]||(o.userPlans&&o.userPlans[o.plan]))Object.assign(S,{plan:o.plan,week:o.week||1,day:o.day||0});else S.wantPos={plan:o.plan,week:o.week||1,day:o.day||0}}
    S.migs=[...new Set([...(S.migs||[]),...(o.migs||[])])];
    installAll(); migrate();
    save(); render(); ghMark(); toast(added?'Dodano treningów: '+added:'Wszystkie treningi z kopii już są w historii');
}
$('#view').addEventListener('change',e=>{
  if(e.target.id==='planfile'&&e.target.files[0]){const rd=new FileReader();rd.onload=()=>importAny(rd.result);rd.onerror=()=>toast('Nie udało się odczytać pliku');rd.readAsText(e.target.files[0]);return}
  if(e.target.id!=='impfile'||!e.target.files[0])return;
  const f=e.target.files[0], rd=new FileReader();
  rd.onload=()=>importAny(rd.result);
  rd.onerror=()=>toast('Nie udało się odczytać pliku');
  rd.readAsText(f);
});

// ---------- plany jako dane ----------
function installPlan(p){
  PLANS[p.id]={name:p.name,sub:p.sub||'',dayPrefix:p.dayPrefix||'',weeks:p.weeks||4,days:p.days.map(d=>({name:d.name,ex:d.ex}))};
  ADD[p.id]=p.days.map(d=>d.add||[]);
  ROUT[p.id]=p.days.map(d=>({w:d.warmup||DEF_ROUT.w,s:d.stretch||DEF_ROUT.s}));
  PLANSRC[p.id]=p;
  Object.assign(ALT,p.alt||{});Object.assign(G,p.guide||{});Object.assign(MOVES,p.moves||{});Object.assign(PLANCUES,p.cues||{});
  Object.entries(p.patterns||{}).forEach(([k,arr])=>{if(MP[k])MX[k]=[...new Set([...(MX[k]||[]),...arr])]});
}
function rebuildSyl(){
  Object.keys(SYL).forEach(k=>delete SYL[k]);
  Object.entries(PLANSRC).forEach(([id,p])=>{const ex=p.extra||{},arr=ex[S.goal]||ex.sport||[];SYL[id]=p.days.map((_,i)=>arr[i]||[])});
}
function installAll(){
  [PLANS,ADD,ROUT,PLANSRC].forEach(o=>Object.keys(o).forEach(k=>delete o[k]));
  BUILTIN.forEach(installPlan);
  Object.values(S.userPlans||{}).forEach(p=>{try{if(!validatePlan(p).err)installPlan(p)}catch(e){}});
  rebuildSyl();
  if(!PLANS[S.plan]){S.plan=PLANS[S.prevPlan]?S.prevPlan:Object.keys(PLANS).pop();S.day=0}
  if(!PLANS[S.plan].days[S.day])S.day=0;
}
function validatePlan(o){
  const bad=m=>({err:m});
  if(!o||o.type!=='dziennik-plan')return bad('To nie jest plik planu (brak "type": "dziennik-plan").');
  if(!/^[a-z0-9_-]{1,24}$/i.test(o.id||''))return bad('Plan nie ma poprawnego identyfikatora (id).');
  if(!o.name)return bad('Plan nie ma nazwy.');
  if(!Array.isArray(o.days)||!o.days.length||o.days.length>7)return bad('Plan musi mieć od 1 do 7 dni treningowych.');
  const moves=Object.assign({},MOVES,o.moves||{}), names=new Set();
  const okEx=x=>Array.isArray(x)&&typeof x[0]==='string'&&Number.isInteger(x[1])&&x[1]>=1&&x[1]<=10&&(x[2]==='max'||(Number.isInteger(x[2])&&x[2]>=1&&x[2]<=50));
  for(const [i,d] of o.days.entries()){
    if(!d||!d.name||!Array.isArray(d.ex)||!d.ex.length)return bad(`Dzień ${i+1}: brak nazwy albo ćwiczeń.`);
    for(const x of [...d.ex,...(d.add||[])]){if(!okEx(x))return bad(`Dzień ${d.name}: błędny zapis ćwiczenia ${JSON.stringify(x).slice(0,60)}.`);names.add(x[0])}
    for(const r of [...(d.warmup||[]),...(d.stretch||[])])if(!Array.isArray(r)||!moves[r[0]]||!(r[1]>0))return bad(`Dzień ${d.name}: nieznany ruch rozgrzewki/rozciągania „${r&&r[0]}”.`);
  }
  Object.values(o.extra||{}).forEach(g=>(g||[]).forEach(day=>(day||[]).forEach(x=>names.add(x[0]))));
  const guide=Object.assign({},G,o.guide||{});
  const ex=(o.extra||{})[S.goal]||(o.extra||{}).sport||[];
  const conf=o.days.map((d,i)=>({d:d.name,c:clashes([...d.ex,...(d.add||[]),...(ex[i]||[])].map(x=>x[0]))})).filter(x=>x.c.length);
  return {warn:[...names].filter(n=>!guide[n]),conf};
}
function loadPlan(txt){
  let o;try{o=JSON.parse(String(txt).trim())}catch(e){return toast('To nie jest poprawny plik planu')}
  // pakiet: kilka planów naraz i opcjonalnie profil
  const list=o&&o.type==='dziennik-pakiet'?(o.plans||[]):[o];
  if(!list.length)return toast('Plik nie zawiera planów');
  const warn=[];
  let conf=0;
  for(const p of list){const v=validatePlan(p);if(v.err)return toast((p&&p.name?p.name+': ':'')+v.err);warn.push(...v.warn);conf+=v.conf.length}
  S.userPlans=S.userPlans||{};
  list.forEach(p=>S.userPlans[p.id]=p);
  if(o.type==='dziennik-pakiet'&&o.profile&&!S.profile)S.profile=o.profile;
  if(o.type==='dziennik-pakiet'&&o.pos&&(BUILTIN_IDS.includes(S.plan)||!PLANS[S.plan]))S.wantPos=o.pos;
  const first=list[list.length-1];
  if(S.plan!==first.id&&!BUILTIN_IDS.includes(S.plan))S.prevPlan=S.plan;
  installAll();
  if(S.wantPos&&PLANS[S.wantPos.plan]){Object.assign(S,{plan:S.wantPos.plan,week:S.wantPos.week||1,day:S.wantPos.day||0});delete S.wantPos}
  else if(!S.sessions.some(x=>x.plan===S.plan)||BUILTIN_IDS.includes(S.plan)){S.plan=first.id;S.day=0;S.week=1}
  S.tab='trening'; save(); render(); window.scrollTo(0,0); ghMark();
  toast('Wczytano: '+list.map(p=>p.name).join(', ')+(conf?`. Dni z dwoma ćwiczeniami na tę samą partię: ${conf} (szczegóły w Analizie)`:'')+(warn.length?'. Brak opisu dla: '+[...new Set(warn)].join(', '):''));
}
function migrate(){
  S.migs=S.migs||[];
  if(!S.sessions.length||S.migs.includes('m1026'))return;
  // jednorazowa migracja danych z wersji 2026-10-26
  const sw=(S.swaps['p12-0']=S.swaps['p12-0']||{}); if(!sw['0'])sw['0']={name:'Przysiad',since:Date.now()};
  if(S.extras['p12-2'])S.extras['p12-2']=S.extras['p12-2'].filter(x=>x.name!=='Wyciskanie na skosie dodatnim');
  S.migs.push('m1026'); save();
}
function reloadState(){S=load();installAll();render()}

// wczytanie z linku: #pakiet=… (dane w części po #, nie trafiają na serwer)
function hashImport(){
  const m=location.hash.match(/^#(?:pakiet|plan|kopia)=(.+)$/); if(!m)return;
  history.replaceState(null,'',location.pathname+location.search);
  let txt;try{const b=atob(m[1].replace(/-/g,'+').replace(/_/g,'/'));txt=new TextDecoder().decode(Uint8Array.from(b,c=>c.charCodeAt(0)))}catch(e){return toast('Link jest uszkodzony. Poproś o nowy.')}
  importAny(txt);
}
setTimeout(hashImport,0);
setTimeout(()=>{try{if(ghCfg().dirty)ghSync()}catch(e){}},2500);
installAll();
migrate();
render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').then(r=>{window.__swr=r;r.update().catch(()=>{})}).catch(()=>{});
  let hadCtl=!!navigator.serviceWorker.controller,rl=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadCtl||rl)return;rl=true;save();if(typeof rt!=='undefined'&&rt&&!rt.done)return toast('Pobrano nową wersję. Zamknij i otwórz aplikację po rozgrzewce.');location.reload()})}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
